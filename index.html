<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow Task Manager</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --background: #eef2ff;
            --card: #ffffff;
            --text: #172033;
            --muted: #718096;
            --border: #e2e8f0;
            --input: #f8fafc;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 24px 70px rgba(31, 41, 55, .16);
        }

        body.dark {
            --background: #111827;
            --card: #1f2937;
            --text: #f8fafc;
            --muted: #a5b4fc;
            --border: #374151;
            --input: #111827;
            --shadow: 0 24px 70px rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            font-family: Inter, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #6366f1, #8b5cf6 45%, #ec4899);
        }

        .container {
            width: 100%;
            max-width: 760px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 28px;
            background: var(--card);
            box-shadow: var(--shadow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 24px;
        }

        .eyebrow {
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            margin-top: 5px;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
        }

        .header p {
            margin-top: 7px;
            color: var(--muted);
        }

        .icon-btn {
            width: 43px;
            height: 43px;
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text);
            background: var(--input);
            cursor: pointer;
            font-size: 18px;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-bottom: 12px;
        }

        input, select, button {
            font: inherit;
        }

        #taskInput, #searchInput, #reminderInput, #priorityInput {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            background: var(--input);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        #addBtn, #notifyBtn, #testAlarmBtn {
            border: 0;
            border-radius: 12px;
            padding: 0 22px;
            color: white;
            background: var(--primary);
            cursor: pointer;
            font-weight: 700;
        }

        #addBtn:hover, #notifyBtn:hover, #testAlarmBtn:hover {
            background: var(--primary-dark);
        }

        .advanced-inputs {
            display: grid;
            grid-template-columns: 1.3fr .7fr auto auto;
            gap: 10px;
            margin-bottom: 22px;
        }

        #notifyBtn, #testAlarmBtn {
            padding: 0 14px;
            font-size: 13px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        #searchInput {
            flex: 1;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            background: var(--card);
            cursor: pointer;
            font-size: 13px;
        }

        .filter-btn.active {
            border-color: var(--primary);
            color: white;
            background: var(--primary);
        }

        .progress-card {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(99,102,241,.12), rgba(139,92,246,.1));
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 9px;
            color: var(--muted);
            font-size: 13px;
        }

        .progress-bar {
            height: 9px;
            overflow: hidden;
            border-radius: 10px;
            background: var(--border);
        }

        #progressFill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary), #ec4899);
            transition: width .3s ease;
        }

        .task-list {
            max-height: 410px;
            overflow-y: auto;
            list-style: none;
        }

        .task-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 12px;
            align-items: center;
            padding: 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 15px;
            background: var(--input);
            animation: slideIn .25s ease;
        }

        .task-item.high { border-left-color: var(--danger); }
        .task-item.medium { border-left-color: #f59e0b; }
        .task-item.low { border-left-color: var(--success); }
        .task-item.completed { opacity: .58; }
        .task-item.completed .task-text { text-decoration: line-through; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .task-text {
            overflow-wrap: anywhere;
            font-weight: 600;
        }

        .task-meta {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
        }

        .priority-label {
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .priority-high { color: #b91c1c; background: #fee2e2; }
        .priority-medium { color: #92400e; background: #fef3c7; }
        .priority-low { color: #047857; background: #d1fae5; }

        .delete-btn {
            padding: 8px 10px;
            border: 0;
            border-radius: 9px;
            color: white;
            background: var(--danger);
            cursor: pointer;
        }

        .empty-state {
            padding: 45px 20px;
            color: var(--muted);
            text-align: center;
        }

        .empty-state div {
            margin-bottom: 10px;
            font-size: 42px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding-top: 20px;
            margin-top: 18px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 14px;
        }

        #clearCompleted {
            border: 0;
            color: var(--primary);
            background: none;
            cursor: pointer;
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            .container {
                padding: 20px 15px;
                margin-top: 10px;
            }

            .input-section,
            .advanced-inputs {
                grid-template-columns: 1fr;
            }

            #addBtn,
            #notifyBtn,
            #testAlarmBtn {
                min-height: 46px;
            }

            .task-item {
                grid-template-columns: auto 1fr auto;
            }

            .priority-label {
                grid-column: 2;
                grid-row: 2;
                width: max-content;
            }

            .delete-btn {
                grid-column: 3;
                grid-row: 1 / span 2;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <div>
                <div class="eyebrow">Stay organized</div>
                <h1>FocusFlow ✨</h1>
                <p id="todayText"></p>
            </div>
            <button class="icon-btn" id="themeBtn" title="Toggle dark mode">🌙</button>
        </header>

        <div class="input-section">
            <input id="taskInput" type="text" placeholder="What needs to be done?" autocomplete="off">
            <button id="addBtn">Add Task</button>
        </div>

        <div class="advanced-inputs">
            <input id="reminderInput" type="datetime-local" title="Set a reminder">
            <select id="priorityInput" title="Task priority">
                <option value="medium">Medium priority</option>
                <option value="high">High priority</option>
                <option value="low">Low priority</option>
            </select>
            <button id="notifyBtn">🔔 Enable Alerts</button>
            <button id="testAlarmBtn">🔊 Test Alarm</button>
        </div>

        <div class="toolbar">
            <input id="searchInput" type="search" placeholder="Search tasks...">
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <section class="progress-card">
            <div class="progress-info">
                <span>Today's progress</span>
                <strong id="progressText">0%</strong>
            </div>
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
        </section>

        <ul class="task-list" id="taskList"></ul>

        <footer class="stats">
            <span id="taskCount">0 tasks remaining</span>
            <button id="clearCompleted">Clear completed</button>
        </footer>
    </main>

    <script>
        let tasks = JSON.parse(localStorage.getItem("focusflowTasks") || "[]");
        let currentFilter = "all";
        let alertPermission = "default";
        let audioContext = null;

        const taskInput = document.getElementById("taskInput");
        const reminderInput = document.getElementById("reminderInput");
        const priorityInput = document.getElementById("priorityInput");
        const taskList = document.getElementById("taskList");
        const searchInput = document.getElementById("searchInput");
        const notifyBtn = document.getElementById("notifyBtn");

        if ("Notification" in window) {
            alertPermission = Notification.permission;
        }

        document.getElementById("todayText").textContent =
            new Date().toLocaleDateString(undefined, {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });

        function saveTasks() {
            localStorage.setItem("focusflowTasks", JSON.stringify(tasks));
        }

        function unlockAudio() {
            if (!("AudioContext" in window || "webkitAudioContext" in window)) return;

            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContextClass();
            }

            if (audioContext.state === "suspended") {
                audioContext.resume();
            }
        }

        function playAlarm() {
            unlockAudio();

            if (audioContext) {
                [0, 0.25, 0.5].forEach(delay => {
                    const oscillator = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    const startTime = audioContext.currentTime + delay;

                    oscillator.type = "sine";
                    oscillator.frequency.value = 880;
                    oscillator.connect(gain);
                    gain.connect(audioContext.destination);

                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);

                    oscillator.start(startTime);
                    oscillator.stop(startTime + 0.22);
                });
            }

            if ("vibrate" in navigator) {
                navigator.vibrate([300, 150, 300, 150, 600]);
            }
        }

        function addTask() {
            unlockAudio();

            const text = taskInput.value.trim();
            if (!text) {
                taskInput.focus();
                return;
            }

            if (reminderInput.value &&
                new Date(reminderInput.value).getTime() <= Date.now()) {
                alert("Please choose a future reminder time.");
                return;
            }

            tasks.unshift({
                id: Date.now(),
                text,
                completed: false,
                priority: priorityInput.value,
                reminder: reminderInput.value || null,
                alerted: false,
                createdAt: new Date().toISOString()
            });

            taskInput.value = "";
            reminderInput.value = "";
            priorityInput.value = "medium";
            saveTasks();
            render();
        }

        function toggleTask(id) {
            const task = tasks.find(item => item.id === id);
            if (task) task.completed = !task.completed;
            saveTasks();
            render();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            render();
        }

        function getFilteredTasks() {
            const search = searchInput.value.toLowerCase().trim();

            return tasks.filter(task => {
                const matchesFilter =
                    currentFilter === "all" ||
                    (currentFilter === "active" && !task.completed) ||
                    (currentFilter === "completed" && task.completed);

                return matchesFilter &&
                    task.text.toLowerCase().includes(search);
            });
        }

        function reminderText(reminder) {
            if (!reminder) return "No reminder";

            const date = new Date(reminder);
            if (date < new Date()) return "⚠️ Overdue";

            return "⏰ " + date.toLocaleString([], {
                dateStyle: "short",
                timeStyle: "short"
            });
        }

        function render() {
            const visibleTasks = getFilteredTasks();

            taskList.innerHTML = visibleTasks.length
                ? visibleTasks.map(task => `
                    <li class="task-item ${task.priority} ${task.completed ? "completed" : ""}">
                        <input class="task-checkbox" type="checkbox"
                            ${task.completed ? "checked" : ""}
                            onchange="toggleTask(${task.id})">

                        <div>
                            <div class="task-text">${escapeHtml(task.text)}</div>
                            <span class="task-meta">${reminderText(task.reminder)}</span>
                        </div>

                        <span class="priority-label priority-${task.priority}">
                            ${task.priority}
                        </span>

                        <button class="delete-btn" onclick="deleteTask(${task.id})">
                            Delete
                        </button>
                    </li>
                `).join("")
                : `<li class="empty-state">
                    <div>📭</div>
                    <p>No matching tasks found.</p>
                </li>`;

            const remaining = tasks.filter(task => !task.completed).length;
            const completed = tasks.filter(task => task.completed).length;
            const percent = tasks.length
                ? Math.round(completed / tasks.length * 100)
                : 0;

            document.getElementById("taskCount").textContent =
                `${remaining} task${remaining === 1 ? "" : "s"} remaining`;

            document.getElementById("progressText").textContent = `${percent}%`;
            document.getElementById("progressFill").style.width = `${percent}%`;
        }

        function escapeHtml(value) {
            const element = document.createElement("div");
            element.textContent = value;
            return element.innerHTML;
        }

        function showNotification(task) {
            if (alertPermission === "granted") {
                const notification = new Notification("Task reminder ⏰", {
                    body: task.text,
                    tag: `focusflow-${task.id}`,
                    requireInteraction: true,
                    vibrate: [300, 150, 300, 150, 600],
                    icon: "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/23f0.png"
                });

                notification.onclick = () => {
                    window.focus();
                    notification.close();
                };
            } else {
                alert(`Reminder: ${task.text}`);
            }
        }

        function checkReminders() {
            const now = Date.now();
            let changed = false;

            tasks.forEach(task => {
                if (!task.completed &&
                    task.reminder &&
                    !task.alerted &&
                    new Date(task.reminder).getTime() <= now) {

                    task.alerted = true;
                    changed = true;

                    playAlarm();
                    showNotification(task);
                }
            });

            if (changed) {
                saveTasks();
                render();
            }
        }

        document.addEventListener("pointerdown", unlockAudio, { once: true });

        document.getElementById("addBtn").addEventListener("click", addTask);

        taskInput.addEventListener("keydown", event => {
            if (event.key === "Enter") addTask();
        });

        document.getElementById("testAlarmBtn").addEventListener("click", () => {
            playAlarm();
            alert("Alarm test complete. Your phone may also vibrate if supported.");
        });

        searchInput.addEventListener("input", render);

        document.querySelectorAll(".filter-btn").forEach(button => {
            button.addEventListener("click", () => {
                document.querySelectorAll(".filter-btn")
                    .forEach(item => item.classList.remove("active"));

                button.classList.add("active");
                currentFilter = button.dataset.filter;
                render();
            });
        });

        document.getElementById("clearCompleted").addEventListener("click", () => {
            tasks = tasks.filter(task => !task.completed);
            saveTasks();
            render();
        });

        document.getElementById("themeBtn").addEventListener("click", event => {
            document.body.classList.toggle("dark");
            const dark = document.body.classList.contains("dark");
            localStorage.setItem("focusflowDark", dark);
            event.target.textContent = dark ? "☀️" : "🌙";
        });

        notifyBtn.addEventListener("click", async () => {
            unlockAudio();

            if (!("Notification" in window)) {
                alert("Browser notifications are not supported.");
                return;
            }

            alertPermission = await Notification.requestPermission();

            notifyBtn.textContent =
                alertPermission === "granted"
                    ? "✅ Alerts Enabled"
                    : "🔔 Enable Alerts";
        });

        if (localStorage.getItem("focusflowDark") === "true") {
            document.body.classList.add("dark");
            document.getElementById("themeBtn").textContent = "☀️";
        }

        notifyBtn.textContent =
            alertPermission === "granted"
                ? "✅ Alerts Enabled"
                : "🔔 Enable Alerts";

        render();
        setInterval(checkReminders, 1000);
    </script>
</body>
</html>
